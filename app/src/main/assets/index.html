<!doctype html>
<html lang="tr" data-theme="modern">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>DPI Aşıcı</title>
<style>
@property --glow { syntax: '<number>'; inherits: true; initial-value: 0; }
:root {                       /* Modern (varsayılan): mor, beyaz, siyah */
  --gece: #0c0a14;
  --gece-ust: #181327;
  --cizgi: #2a2142;
  --metin: #ffffff;
  --soluk: #b6acd0;
  --acik: #a78bfa;               /* vurgu çizgi/halka */
  --dolgu: #7c3aed;              /* dolu yüzeyler */
  --dolgu-metin: #ffffff;
  --glyph-on: #ffffff;
  --rgb: 167,139,250;
  --hata: #ff9a8a;
  --ring-kapali: #4b3f72;
  --r: 14px;
}
:root[data-theme="classic"] {
  --gece: #101426;
  --gece-ust: #161c36;
  --cizgi: #252c4a;
  --metin: #eef1fa;
  --soluk: #98a2c3;
  --acik: #3ee0b0;
  --dolgu: #3ee0b0;
  --dolgu-metin: #101426;
  --glyph-on: currentColor;
  --rgb: 62,224,176;
  --hata: #ff8d7a;
  --ring-kapali: #46507a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--gece); }
body {
  margin: 0; min-height: 100vh; color: var(--metin);
  font: 16px/1.45 Roboto, "Segoe UI", system-ui, sans-serif;
  background:
    radial-gradient(120% 60% at 50% 0%, rgba(var(--rgb),var(--glow, 0)) 0%, rgba(var(--rgb),0) 70%),
    var(--gece);
  transition: --glow .6s;
  padding: max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
  -webkit-user-select: none; user-select: none;
}
body.on { --glow: .16; }
main { max-width: 440px; margin: 0 auto; }

header { display: flex; align-items: center; gap: 10px; }
header h1 { flex: none; }
.net-wrap { flex: 1; min-width: 0; display: flex; justify-content: flex-end; }
.gear { flex: none; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: var(--gece-ust); color: var(--soluk); cursor: pointer; display: grid; place-items: center; }
.gear svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.gear[aria-expanded="true"] { color: var(--metin); }
.gear:focus-visible { outline: 2px solid var(--metin); outline-offset: 2px; }
h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .2px; }
.net {
  display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-width: 0;
  padding: 6px 12px; border-radius: 999px; background: var(--gece-ust);
  font-size: 13px; color: var(--soluk); white-space: nowrap;
}
.net span { overflow: hidden; text-overflow: ellipsis; }
.net i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ring-kapali); }
body.on .net i { background: var(--acik); }
body.nonet .net i { background: var(--hata); }

/* --- Kahraman: parçalı halka düğme --- */
.hero { display: flex; flex-direction: column; align-items: center; padding: 34px 0 8px; text-align: center; }
.power {
  position: relative; width: 208px; height: 208px; padding: 0; border: 0; border-radius: 50%;
  background: radial-gradient(closest-side, var(--gece-ust) 78%, transparent 79%);
  color: var(--ring-kapali); cursor: pointer; transition: color .4s, transform .15s;
}
.power:active { transform: scale(.97); }
.power:focus-visible { outline: 3px solid var(--metin); outline-offset: 6px; }
.power svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ring { transform-origin: 50% 50%; }
.ring circle { fill: none; stroke: currentColor; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 16 8 5 8 38 8 10 8; }
.glyph { stroke: currentColor; transition: stroke .4s; fill: none; stroke-width: 7; stroke-linecap: round; }
body.on .power { color: var(--acik); }
body.on .glyph { stroke: var(--glyph-on); }
body.on .ring { animation: don 26s linear infinite; }
body.busy .ring { animation: don 3s linear infinite; }
body.busy .power { color: var(--soluk); }
@keyframes don { to { transform: rotate(360deg); } }
.halo {
  position: absolute; inset: -22px; border-radius: 50%; opacity: 0; pointer-events: none;
  background: radial-gradient(closest-side, rgba(var(--rgb),.26), rgba(var(--rgb),0) 72%);
  transition: opacity .6s;
}
body.on .halo { opacity: 1; }

h2 { margin: 26px 0 4px; font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -.5px; }
#sub { margin: 0; min-height: 44px; max-width: 30ch; color: var(--soluk); font-size: 15px; }
#sub.err { color: var(--hata); }

/* --- Sayaçlar --- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); margin: 24px 0 8px; border-top: 1px solid var(--cizgi); border-bottom: 1px solid var(--cizgi); }
.stats div { padding: 16px 0 14px; text-align: center; }
.stats div + div { border-left: 1px solid var(--cizgi); }
.stats dt { margin: 0; color: var(--soluk); font-size: 13px; }
.stats dd { margin: 2px 0 0; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
body:not(.on) .stats dd { color: var(--soluk); }

/* --- Bölümler --- */
section.row { padding: 20px 0; border-bottom: 1px solid var(--cizgi); }
section.row h3 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
.muted { margin: 0; color: var(--soluk); font-size: 14px; }
.kv { display: flex; justify-content: space-between; gap: 16px; padding: 4px 0; font-size: 15px; }
.kv b { font-weight: 500; color: var(--soluk); }
.kv span { text-align: right; }

.seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; margin: 14px 0 12px; padding: 3px; border-radius: var(--r); background: var(--gece-ust); }
.seg button {
  position: relative; z-index: 1; padding: 10px 0; border: 0; background: none; color: var(--soluk);
  font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: color .2s;
}
.seg button[aria-checked="true"] { color: var(--dolgu-metin); }
.seg::before {
  content: ""; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px);
  border-radius: 11px; background: var(--dolgu); transition: transform .22s cubic-bezier(.3,.8,.3,1);
}
.seg[data-v="b"]::before { transform: translateX(100%); }
.seg button:focus-visible { outline: 2px solid var(--metin); outline-offset: 2px; border-radius: 11px; }

.list { display: none; margin: 0; padding: 0; list-style: none; }
.list.open { display: block; }
.list li { border-top: 1px solid var(--cizgi); }
.list button {
  display: grid; grid-template-columns: 22px 1fr; column-gap: 12px; width: 100%; padding: 12px 0;
  border: 0; background: none; color: var(--metin); font: inherit; text-align: left; cursor: pointer;
}
.list button:focus-visible { outline: 2px solid var(--metin); outline-offset: -2px; border-radius: 8px; }
.list .o { grid-row: span 2; align-self: center; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ring-kapali); }
.list [aria-checked="true"] .o { border: 5px solid var(--acik); }

.list small { color: var(--soluk); font-size: 13px; }

details { padding: 18px 0 0; }
summary { cursor: pointer; font-weight: 600; font-size: 15px; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; float: right; color: var(--soluk); font-size: 20px; line-height: 1; }
details[open] summary::after { content: "–"; }
details ul { margin: 12px 0; padding-left: 18px; color: var(--soluk); font-size: 14px; }
details li + li { margin-top: 6px; }
.btn {
  display: inline-block; margin-top: 4px; padding: 11px 16px; border: 1px solid var(--ring-kapali); border-radius: var(--r);
  background: none; color: var(--metin); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 18px; }
.chip { padding: 9px 14px; border: 1px solid var(--cizgi); border-radius: 999px; background: none; color: var(--soluk); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.chip[aria-checked="true"] { border-color: var(--acik); color: var(--metin); background: var(--gece-ust); }
.chip:focus-visible { outline: 2px solid var(--metin); outline-offset: 2px; }
#settings h3 + .chips { margin-bottom: 20px; }
#settings .seg { margin-top: 10px; margin-bottom: 0; }
.btn:active { background: var(--gece-ust); }

@media (prefers-reduced-motion: reduce) {
  body.on .ring, body.busy .ring { animation: none; }
  .seg::before, .halo { transition: none; }
}
@media (max-height: 640px) { .hero { padding-top: 16px; } .power { width: 172px; height: 172px; } h2 { margin-top: 16px; } }
</style>
</head>

    <h2 id="state"></h2>

  <dl class="stats">
    <div><dt data-i="conns"></dt><dd id="sAct">0</dd></div>

    <div><dt data-i="up"></dt><dd id="sUp">0 B</dd></div>

  <section class="row">

      <button role="radio" id="bAuto" aria-checked="true" data-i="auto"></button>
      <button role="radio" id="bManual" aria-checked="false" data-i="manual"></button>
    </div>
    <p class="muted" id="modeNote"></p>
    <ul class="list" id="list" role="radiogroup"></ul>
  </section>

  <section class="row" id="netRow">
    <div class="kv"><b data-i="kvNet"></b><span id="kvNet">–</span></div>
    <div class="kv"><b data-i="kvStrat"></b><span id="kvStrat">–</span></div>
    <div class="kv"><b data-i="kvFb"></b><span id="kvFb">0</span></div>
  </section>

  <details>
    <summary data-i="helpQ"></summary>
    <ul>
      <li data-i="h1"></li>
      <li data-i="h2"></li>
      <li data-i="h3"></li>
    </ul>
    <button class="btn" id="battery" data-i="battery"></button>
  </details>
</main>

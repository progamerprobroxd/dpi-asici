plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.dpiasici.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dpiasici.app'
        minSdk 26
        // 33: Android 14'ün zorunlu kıldığı "ön plan servisi türü" beyanı gerekmez.
        targetSdk 33
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            storeFile file('dpi-release.jks')
            storePassword 'dpiasici'
            keyAlias 'dpi'
            keyPassword 'dpiasici'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

repositories {
    // gomobile'ın ürettiği core.aar buradan alınır.
    flatDir { dirs 'libs' }
}

dependencies {
    implementation(name: 'core', ext: 'aar')
}
